spring.application.name=sentinel-guard
server.port=8090

# Java 21+ Virtual Threads
spring.threads.virtual.enabled=true

# ===================================================================
# Configurable Database Persistence
# Supports: Persistent Disk H2 (default), PostgreSQL, and MySQL
# Override easily via environment variables or CLI arguments:
# - DATABASE_URL / SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# - SPRING_PROFILES_ACTIVE=postgres or SPRING_PROFILES_ACTIVE=mysql
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/sentineldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available when running on H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Data Retention Policy (Configurable 6-Month / 180-Day Lifecycle)
# ===================================================================
sentinel.waf.data-retention.enabled=${SENTINEL_RETENTION_ENABLED:true}
sentinel.waf.data-retention.days=${SENTINEL_DATA_RETENTION_DAYS:180}
sentinel.waf.data-retention.cleanup-cron=${SENTINEL_RETENTION_CRON:0 0 2 * * *}

# ===================================================================
# Security & WAF Defaults
# ===================================================================
sentinel.waf.enabled=true
sentinel.waf.rate-limit.requests-per-second=20
sentinel.waf.rate-limit.burst-capacity=25
sentinel.waf.rate-limit.ip-ban-duration-seconds=300
sentinel.waf.alert-email.enabled=false
sentinel.waf.alert-sms.enabled=false

# Inline WAF reverse-proxy
sentinel.waf.public-ip=${SENTINEL_WAF_PUBLIC_IP:140.245.250.50}
sentinel.waf.public-ipv6=${SENTINEL_WAF_PUBLIC_IPV6:}
sentinel.waf.control-plane-hosts=${SENTINEL_CONTROL_PLANE_HOSTS:sentinel-guard.singamsettikrishna.in}
sentinel.waf.treat-loopback-as-waf=${SENTINEL_TREAT_LOOPBACK_AS_WAF:true}
sentinel.waf.seed.usertesting-origin=${SENTINEL_USERTESTING_ORIGIN:http://127.0.0.1:8085}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.krish.sentinel_guard=INFO
logging.level.org.springframework.security=WARN
