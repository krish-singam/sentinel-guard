server.port=${PORT:8080}
spring.application.name=sentinel-guard

# Virtual Threads
spring.threads.virtual.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:sentinelguard}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:krish}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:sentinelpassword123}}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# WAF & Alert Defaults in Prod
sentinel.waf.enabled=true
sentinel.waf.rate-limit.requests-per-second=${WAF_RPS:100}
sentinel.waf.rate-limit.burst-capacity=${WAF_BURST:200}
sentinel.waf.rate-limit.ip-ban-duration-seconds=600
sentinel.waf.alert-email.enabled=${ALERT_EMAIL_ENABLED:false}
sentinel.waf.alert-sms.enabled=${ALERT_SMS_ENABLED:false}

sentinel.waf.public-ip=${SENTINEL_WAF_PUBLIC_IP:140.245.250.50}
sentinel.waf.control-plane-hosts=${SENTINEL_CONTROL_PLANE_HOSTS:sentinel-guard.singamsettikrishna.in}
sentinel.waf.seed.usertesting-origin=${SENTINEL_USERTESTING_ORIGIN:http://host.docker.internal:8080}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.krish.sentinel_guard=INFO
logging.level.org.springframework.security=WARN
