server.port=${PORT:8080}
spring.application.name=sentinel-guard

# Virtual Threads
spring.threads.virtual.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:sentinelguard}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:krish}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:sentinelpassword123}}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# WAF & Alert Defaults in Prod
sentinel.waf.enabled=true
sentinel.waf.rate-limit.requests-per-second=${WAF_RPS:100}
sentinel.waf.rate-limit.burst-capacity=${WAF_BURST:200}
sentinel.waf.rate-limit.ip-ban-duration-seconds=600
sentinel.waf.alert-email.enabled=${ALERT_EMAIL_ENABLED:false}
sentinel.waf.alert-sms.enabled=${ALERT_SMS_ENABLED:false}

# Logging
logging.level.com.krish.sentinel_guard=INFO
logging.level.org.springframework.security=WARN
