services:
  sentinel-postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_guard_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinel_guard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  sentinel-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-guard-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://sentinel-postgres:5432/sentinel_guard_db
      SPRING_DATASOURCE_USERNAME: sentinel_user
      SPRING_DATASOURCE_PASSWORD: sentinel_secure_password_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      sentinel-postgres:
        condition: service_healthy
    networks:
      - sentinel-network

volumes:
  postgres_data:

networks:
  sentinel-network:
    driver: bridge
